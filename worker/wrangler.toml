name = "perps-basket-trainer"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
MAIN_ADDRESS = ""
TELEGRAM_OWNER_CHAT_ID = "-4693697209"
HL_API_URL = "https://api.hyperliquid.xyz"
